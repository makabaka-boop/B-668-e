spring:
  application:
    name: leave-management-system

  profiles:
    active: dev

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:leave_manage}?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}

  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 10MB

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.lms.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

server:
  port: 8081
  servlet:
    context-path: /

# 业务配置
lms:
  current-term: ${CURRENT_TERM:2025-2026-1}

# 文件上传配置
file:
  upload:
    path: uploads/
    base-url: ${FILE_BASE_URL:/uploads/}

logging:
  level:
    com.example.lms: INFO
    com.example.lms.mapper: DEBUG
